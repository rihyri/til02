server:
  port: 8083

spring:
  application:
    name: order-api
  datasource:
    url: jdbc:h2:mem:orderdb;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true          # http://localhost:8083/h2-console (JDBC URL: jdbc:h2:mem:orderdb)
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false

logging:
  level:
    com.ecommerce.order: DEBUG
