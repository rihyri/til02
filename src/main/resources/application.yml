server:
  port: 8087
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: til02

  # h2:
    # console:
      # enabled: true
      # path: /h2-console

  datasource:

    # ====== h2 database ======
    # url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    # driver-class-name: org.h2.Driver
    # username: sa
    # password:

    url: jdbc:mysql://localhost:3309/sparta?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    org.hibernate.SQL: DEBUG